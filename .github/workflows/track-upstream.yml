name: track-upstream
on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch: {}

# Watch upstream FreeType (GNU Savannah). When a release appears that has no
# tag yet, this workflow does everything itself in one shot: build -> verify
# -> bake dist/ + version into vX.Y.Z and push (scripts/finalize-tag.sh).
#
# Why self-contained instead of "push a thin tag and let build-tag.yml finish":
#   a tag pushed with the default GITHUB_TOKEN does NOT trigger other
#   workflows, so build-tag.yml would never run -> auto-tracked tags would
#   forever lack dist (this actually happened to v2.14.3).
# If the new upstream release breaks the build, set -e in finalize aborts ->
# no tag is created -> the broken version never enters distribution.
jobs:
  track:
    runs-on: ubuntu-latest
    container: emscripten/emsdk:3.1.74
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install cmake / git
        run: apt-get update && apt-get install -y --no-install-recommends cmake git

      - name: compute "upstream latest" vs "covered"
        id: chk
        run: |
          git config --global --add safe.directory "*"
          LATEST="$(curl -fsSL https://download.savannah.gnu.org/releases/freetype/ \
            | grep -oE 'freetype-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz' \
            | sed -E 's/freetype-([0-9.]+)\.tar\.gz/\1/' \
            | sort -V | tail -1)"
          [ -n "$LATEST" ] || { echo "!! could not parse an upstream version"; exit 1; }
          # covered: only strict vX.Y.Z counts (1:1 with upstream, no -N)
          COVERED="$(git tag -l 'v*' | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' | sort -u)"
          echo ">>> upstream latest FreeType=$LATEST"
          echo ">>> covered: $(echo "$COVERED" | tr '\n' ' ')"
          if echo "$COVERED" | grep -qx "$LATEST"; then
            echo "new=0" >> "$GITHUB_OUTPUT"
            echo ">>> already up to date, nothing to do"
          else
            echo "new=1" >> "$GITHUB_OUTPUT"
            echo "ver=$LATEST" >> "$GITHUB_OUTPUT"
            echo ">>> new release $LATEST, will build+verify then bake into v$LATEST"
          fi

      - name: build + verify + bake into v$LATEST (no tag if it fails)
        if: steps.chk.outputs.new == '1'
        run: FT_VER="${{ steps.chk.outputs.ver }}" bash scripts/finalize-tag.sh
