name: track-upstream
on:
  schedule:
    - cron: "0 6 * * 1" # 每周一 06:00 UTC
  workflow_dispatch: {}

# 监视上游 FreeType（GNU Savannah）。出现尚未打 tag 的新版时：
# 先就地构建+验证作为"门"，仅当验证通过，才在 main 上打一个"瘦" tag vX.Y.Z
# 并推送 → 触发 build-tag.yml 真正构建并把 dist/ 固化进该 tag。
# 上游新版若破坏构建：验证不过 → 不打 tag → 坏版本不会进分发。
jobs:
  track:
    runs-on: ubuntu-latest
    container: emscripten/emsdk:3.1.74
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 装 cmake / git
        run: apt-get update && apt-get install -y --no-install-recommends cmake git

      - name: 算"上游最新" vs "已覆盖"
        id: chk
        run: |
          git config --global --add safe.directory "*"
          LATEST="$(curl -fsSL https://download.savannah.gnu.org/releases/freetype/ \
            | grep -oE 'freetype-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz' \
            | sed -E 's/freetype-([0-9.]+)\.tar\.gz/\1/' \
            | sort -V | tail -1)"
          [ -n "$LATEST" ] || { echo "!! 没解析到上游版本"; exit 1; }
          # 已覆盖的 FreeType 版本（tag vX.Y.Z[-N] 去 v 去 -N）
          COVERED="$(git tag -l 'v*' | sed -E 's/^v//; s/-.*$//' | sort -u)"
          echo ">>> 上游最新 FreeType=$LATEST"
          echo ">>> 已覆盖: $(echo "$COVERED" | tr '\n' ' ')"
          if echo "$COVERED" | grep -qx "$LATEST"; then
            echo "new=0" >> "$GITHUB_OUTPUT"
            echo ">>> 已是最新，无事可做"
          else
            echo "new=1" >> "$GITHUB_OUTPUT"
            echo "ver=$LATEST" >> "$GITHUB_OUTPUT"
            echo ">>> 发现新版 $LATEST，将构建验证后打 tag"
          fi

      - name: 构建新版（门）
        if: steps.chk.outputs.new == '1'
        run: FT_VER="${{ steps.chk.outputs.ver }}" bash build.sh

      - name: 验证新版（门，不过则不打 tag）
        if: steps.chk.outputs.new == '1'
        run: node test/test.mjs

      - name: 验证通过 → 打 vX.Y.Z 瘦 tag（build-tag.yml 收尾固化 dist）
        if: steps.chk.outputs.new == '1'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          TAG="v${{ steps.chk.outputs.ver }}"
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
          echo ">>> 已打并推送 $TAG（build-tag.yml 将构建并把 dist 固化进该 tag）"
