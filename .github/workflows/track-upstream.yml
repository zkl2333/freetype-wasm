name: track-upstream
on:
  schedule:
    - cron: "0 6 * * 1" # 每周一 06:00 UTC
  workflow_dispatch: {}

# 监视上游 FreeType（GNU Savannah）。出现尚未打 tag 的新版时，本 workflow 自己
# 一口气 构建 → 验证 → 把 dist/ + 版本号固化进 vX.Y.Z 并推送（scripts/finalize-tag.sh）。
#
# 为什么自完结、不再“打瘦 tag 让 build-tag.yml 收尾”：
#   GitHub Actions 用默认 GITHUB_TOKEN 推的 tag 不会触发别的 workflow，
#   旧设计里 build-tag.yml 根本不会被触发 → 自动追的 tag 永远是没 dist 的坏 tag。
# 上游新版若破坏构建：finalize 里 set -e 失败 → 不打 tag → 坏版本不进分发。
jobs:
  track:
    runs-on: ubuntu-latest
    container: emscripten/emsdk:3.1.74
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 装 cmake / git
        run: apt-get update && apt-get install -y --no-install-recommends cmake git

      - name: 算“上游最新” vs “已覆盖”
        id: chk
        run: |
          git config --global --add safe.directory "*"
          LATEST="$(curl -fsSL https://download.savannah.gnu.org/releases/freetype/ \
            | grep -oE 'freetype-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz' \
            | sed -E 's/freetype-([0-9.]+)\.tar\.gz/\1/' \
            | sort -V | tail -1)"
          [ -n "$LATEST" ] || { echo "!! 没解析到上游版本"; exit 1; }
          # 已覆盖：只认严格 vX.Y.Z（与上游 1:1，没有 -N）
          COVERED="$(git tag -l 'v*' | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' | sort -u)"
          echo ">>> 上游最新 FreeType=$LATEST"
          echo ">>> 已覆盖: $(echo "$COVERED" | tr '\n' ' ')"
          if echo "$COVERED" | grep -qx "$LATEST"; then
            echo "new=0" >> "$GITHUB_OUTPUT"
            echo ">>> 已是最新，无事可做"
          else
            echo "new=1" >> "$GITHUB_OUTPUT"
            echo "ver=$LATEST" >> "$GITHUB_OUTPUT"
            echo ">>> 发现新版 $LATEST，将构建验证后固化进 v$LATEST"
          fi

      - name: 构建 + 验证 + 固化进 v$LATEST（不过则不打 tag）
        if: steps.chk.outputs.new == '1'
        run: FT_VER="${{ steps.chk.outputs.ver }}" bash scripts/finalize-tag.sh
