name: build-tag
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream FreeType version to (re)build & release, e.g. 2.14.3"
        required: true
        type: string

concurrency:
  group: freetype-release
  cancel-in-progress: false

# Releases are published to npm and also baked into the git tag (no GitHub Release).
# Tags map 1:1 to upstream FreeType: v2.14.3 builds FreeType 2.14.3.
# There are no -N revision tags. vX.Y.Z is a ROLLING pointer to the latest
# build of that FreeType version; re-release a new build config of the same
# version by either re-pushing the tag OR (easier) running this workflow
# manually with the version input -- no local force-push needed.
# Byte-stable consumers pin the build commit SHA (printed by finalize-tag.sh).
#
#   jsdelivr: https://cdn.jsdelivr.net/gh/zkl2333/freetype-wasm@<tag>/dist/index.mjs
#   npm:      npm i @zkl2333/freetype-wasm
#
# If verify fails the run is red and nothing is baked -> bad artifacts never
# enter a tag. (Auto-tracking upstream lives in track-upstream.yml, which
# finalizes itself and does NOT rely on triggering this workflow.)
jobs:
  build-tag:
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
      release_version: ${{ steps.ver.outputs.ft }}
    runs-on: ubuntu-latest
    container: emscripten/emsdk:3.1.74
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install cmake / git
        run: apt-get update && apt-get install -y --no-install-recommends cmake git

      - name: resolve upstream version (strict 1:1, reject -N)
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${INPUT_VERSION#v}"          # accept "2.14.3" or "v2.14.3"
          else
            RAW="${GITHUB_REF_NAME#v}"        # tag push: v2.14.3 -> 2.14.3
          fi
          if ! printf '%s' "$RAW" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "!! '$RAW' is not X.Y.Z -- must map 1:1 to upstream FreeType, no -N / suffixes"
            exit 1
          fi
          echo "ft=$RAW" >> "$GITHUB_OUTPUT"
          echo ">>> FreeType $RAW -> tag v$RAW"

      - name: build + verify + bake dist/ into the tag (+ purge jsdelivr)
        id: release
        run: |
          FT_VER="${{ steps.ver.outputs.ft }}" bash scripts/finalize-tag.sh
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish-npm:
    needs: build-tag
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm.yml
    with:
      release_sha: ${{ needs.build-tag.outputs.release_sha }}
      expected_version: ${{ needs.build-tag.outputs.release_version }}
    secrets: inherit
