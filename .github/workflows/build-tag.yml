name: build-tag
on:
  push:
    tags: ["v*"]

# 分发就是 git tag 本身（不发 npm、不发 GitHub Release）。
# tag 与上游 FreeType 1:1：v2.14.3 → 构建 FreeType 2.14.3。
# 不存在 -N 修订 tag —— 打包/wrapper 改了但 FreeType 没升级，就原地强制重建同一个 vX.Y.Z。
#
# 用途：人手推一个“瘦” tag（或重推已有 tag）→ 本 workflow 构建+验证 →
# 把 dist/ + 同步后的版本号固化进该 tag（不碰 main）。于是
#   jsdelivr: https://cdn.jsdelivr.net/gh/zkl2333/freetype-wasm@<tag>/dist/index.mjs
#   npm:      npm i github:zkl2333/freetype-wasm#<tag>
# 都直接可消费。验证不过则 run 红、不固化 → 坏产物不会进 tag。
# （自动追上游见 track-upstream.yml，它自带 finalize，不依赖触发本 workflow。）
jobs:
  build-tag:
    runs-on: ubuntu-latest
    container: emscripten/emsdk:3.1.74
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 装 cmake / git
        run: apt-get update && apt-get install -y --no-install-recommends cmake git

      - name: 从 tag 解析上游版本（强制 1:1，拒 -N）
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "!! tag '$TAG' 不是 vX.Y.Z —— tag 必须与上游 FreeType 1:1，不接受 -N/任意后缀"
            exit 1
          fi
          FT_VER="${TAG#v}"
          echo "ft=$FT_VER" >> "$GITHUB_OUTPUT"
          echo ">>> tag=$TAG → FreeType $FT_VER"

      - name: 构建 + 验证 + 把 dist/ 固化进该 tag
        run: FT_VER="${{ steps.ver.outputs.ft }}" bash scripts/finalize-tag.sh
