name: build-tag
on:
  push:
    tags: ["v*"]

# Distribution IS the git tag itself (no npm, no GitHub Release).
# Tags map 1:1 to upstream FreeType: v2.14.3 builds FreeType 2.14.3.
# There are no -N revision tags -- if the build scripts/wrapper change
# without a FreeType bump, force-rebuild the same vX.Y.Z in place.
#
# Use: a human pushes a thin tag (or re-pushes an existing one) -> this
# workflow builds + verifies -> bakes dist/ + the synced version into the
# tag (main untouched). Then both:
#   jsdelivr: https://cdn.jsdelivr.net/gh/zkl2333/freetype-wasm@<tag>/dist/index.mjs
#   npm:      npm i github:zkl2333/freetype-wasm#<tag>
# are directly consumable. If verify fails the run is red and nothing is
# baked -> bad artifacts never enter a tag.
# (Auto-tracking upstream lives in track-upstream.yml, which finalizes
# itself and does NOT rely on triggering this workflow.)
jobs:
  build-tag:
    runs-on: ubuntu-latest
    container: emscripten/emsdk:3.1.74
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install cmake / git
        run: apt-get update && apt-get install -y --no-install-recommends cmake git

      - name: parse upstream version from tag (strict 1:1, reject -N)
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "!! tag '$TAG' is not vX.Y.Z -- tags must map 1:1 to upstream FreeType, no -N / suffixes"
            exit 1
          fi
          FT_VER="${TAG#v}"
          echo "ft=$FT_VER" >> "$GITHUB_OUTPUT"
          echo ">>> tag=$TAG -> FreeType $FT_VER"

      - name: build + verify + bake dist/ into the tag
        run: FT_VER="${{ steps.ver.outputs.ft }}" bash scripts/finalize-tag.sh
