name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: emscripten/emsdk:3.1.74
    steps:
      - uses: actions/checkout@v4

      - name: 装 cmake
        run: apt-get update && apt-get install -y --no-install-recommends cmake

      - name: 构建（FreeType → WASM，完整公共 API + 内存可增长）
        run: bash build.sh

      - name: 验证（大 CJK 不 OOM + MONO + 灰度 AA + metrics/kerning）
        run: node test/test.mjs

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freetype-wasm-dist
          path: dist/*
