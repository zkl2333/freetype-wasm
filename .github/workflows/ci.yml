name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: emscripten/emsdk:3.1.74@sha256:af45409f3199d88db4b1b03af0098532c8fb33a375ac257463eeb0a622870d06
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: 装构建与验签工具
        run: apt-get update && apt-get install -y --no-install-recommends cmake gnupg gpgv

      - name: 从 package.json 读取双版本
        shell: bash
        run: |
          set -euo pipefail
          echo "PKG_VER=$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"
          echo "FT_VER=$(node -p 'require("./package.json").freetypeVersion')" >> "$GITHUB_ENV"

      - name: 构建（FreeType → WASM，完整公共 API + 内存可增长）
        run: bash build.sh

      - name: 验证（CJK + MONO/AA/LCD/SDF + PNG/bzip2 + Worker）
        run: node test/test.mjs

      - name: 验证 npm 包内容
        run: npm run check:package && npm pack --dry-run

      - name: 上传产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: freetype-wasm-dist
          path: dist/*
